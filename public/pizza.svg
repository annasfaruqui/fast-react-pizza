<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="crust" cx="50%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#E59866"/>
      <stop offset="100%" stop-color="#A04000"/>
    </radialGradient>
    <linearGradient id="cheese" x1="0%" y1="20%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F9E79F"/>
      <stop offset="60%" stop-color="#F5B041"/>
      <stop offset="100%" stop-color="#E67E22"/>
    </linearGradient>
  </defs>

  <!-- Pizza Slice Body (Cheese & Sauce) -->
  <path d="M 12 22 Q 50 12 88 22 L 50 94 Z" fill="url(#cheese)" stroke="#D35400" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Golden Brown Crust -->
  <path d="M 10 20 Q 50 6 90 20 Q 50 14 10 20 Z" fill="url(#crust)" stroke="#78281F" stroke-width="1.5"/>

  <!-- Pepperoni slices -->
  <circle cx="50" cy="38" r="9" fill="#C0392B" stroke="#922B21" stroke-width="1.5"/>
  <circle cx="34" cy="53" r="8" fill="#C0392B" stroke="#922B21" stroke-width="1.5"/>
  <circle cx="64" cy="55" r="8" fill="#C0392B" stroke="#922B21" stroke-width="1.5"/>
  <circle cx="49" cy="73" r="6.5" fill="#C0392B" stroke="#922B21" stroke-width="1.5"/>

  <!-- Basil leaves -->
  <path d="M 38 32 Q 44 28 44 34 Q 38 36 38 32 Z" fill="#229954"/>
  <path d="M 58 45 Q 64 42 63 48 Q 57 48 58 45 Z" fill="#229954"/>
  <path d="M 37 68 Q 42 65 42 70 Q 37 71 37 68 Z" fill="#229954"/>

  <!-- Melted cheese drip at top -->
  <path d="M 22 23 Q 25 28 28 23 Q 32 29 36 23" fill="none" stroke="#F9E79F" stroke-width="1.5" stroke-linecap="round"/>
</svg>
